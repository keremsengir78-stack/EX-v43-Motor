name: EX weekly research evidence
on:
  pull_request:
    branches: [ex-v43-development]
    paths: [.github/workflows/ex-weekly-evidence.yml, run_ex_weekly_capacity.py, ex_evidence_store.py, run_ex_production_coverage.py]
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
    inputs:
      week_start:
        description: Monday UTC for the seven-day published fixture inventory
        required: true
        type: string
      persist_inventory:
        description: Archive the generated weekly inventory
        type: boolean
        default: false
      preserve_only:
        description: Only persist evidence without refreshing the weekly fixture inventory
        type: boolean
        default: false
      artifact_ids:
        description: Optional comma separated forecast and settlement artifact IDs to preserve
        type: string
permissions:
  actions: read
  contents: read
jobs:
  inventory:
    needs: preserve
    if: always() && !inputs.preserve_only && (needs.preserve.result == 'success' || needs.preserve.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore durable inputs
        id: evidence
        run: |
          ref=refs/heads/ex-evidence-archive
          if [ -n "$(git ls-remote origin "$ref")" ]; then
            git fetch origin "$ref"
            git worktree add --detach durable-evidence FETCH_HEAD
            python ex_evidence_store.py --store durable-evidence restore --kind prematch-and-research --output packs
            python ex_evidence_store.py --store durable-evidence restore --kind settlement-and-performance --output settlements
            python ex_evidence_store.py --store durable-evidence restore --kind weekly-capacity --output prior-weeks --limit 4
            python ex_evidence_store.py --store durable-evidence restore --kind retrospective-research --output pilot --limit 1
          fi
          if ! find pilot -name retrospective-examples.jsonl -print -quit 2>/dev/null | grep -q .; then
            echo "need_pilot=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.evidence.outputs.need_pilot == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: 45567037197
          name: ex-retrospective-results
          path: pilot
      - env:
          WEEK_START: ${{ inputs.week_start || '' }}
        run: |
          if [ -z "$WEEK_START" ]; then
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then WEEK_START=$(date -u -d '7 days ago' +%F)
            else WEEK_START=2026-11-23; fi
          fi
          examples=$(find pilot -name retrospective-examples.jsonl -type f -print -quit)
          test -n "$examples"
          python run_ex_weekly_capacity.py --week-start "$WEEK_START" --output weekly --packs packs --settlements settlements --prior-weeks prior-weeks --examples "$examples"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("weekly/capacity.json"))
          print("## Weekly EX capacity (UTC)")
          print(f"\nPublished: {report['published_fixtures']} | Boards: {report['boards_observed']}/{report['boards_expected']} | Reused: {report['cached_boards']} | Requests: {report['network_requests']}")
          window = report["capture_window"]
          print(f"\nCapture window opened: {window['opened']} | Not yet due: {window['not_due']}")
          print("\n| Competition | Published | Prematch | Venue5 | Domestic baseline | Full strength | Settled venue5 | Full model |")
          print("| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |")
          for league, published in report["by_league"].items():
              coverage = report["observed_coverage"][league]
              print(f"| {league} | {published} | {coverage['prematch_archived']} | "
                    f"{coverage['sealed_research_forecasts']} | {coverage['domestic_research_baselines']} | "
                    f"{coverage['full_strength_window']} | {coverage['independently_settled_venue5']} | "
                    f"{coverage['full_model_verified']} |")
          performance = report["weekly_performance"]
          print(f"\nWeekly paired outcomes: {performance['matched']} ({performance['status']})")
          for market, brier in performance["venue5_brier"].items():
              print(f"- {market} venue5 Brier: {brier:.6f}")
          domestic = performance["domestic_research"]
          print(f"\nDomestic research paired outcomes: {domestic['matched']}")
          for market, brier in domestic["brier"].items():
              print(f"- {market} domestic research Brier: {brier:.6f}")
          for market, design in report["retrospective_sizing"]["markets"].items():
              weeks = design.get("weeks_by_matches_per_week_and_assumed_intraweek_correlation", {})
              print(f"\n- {market} strength, indicative weeks by intraweek correlation: "
                    f"25/week {weeks.get('25')} | fixture ceiling {weeks.get(str(report['published_fixtures']))}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ex-weekly-capacity
          path: weekly/
  preserve:
    if: inputs.artifact_ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify and persist exact artifact bytes
        env:
          ARTIFACT_IDS: ${{ inputs.artifact_ids }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]]
          root="$(mktemp -d)"
          ref=refs/heads/ex-evidence-archive
          existing=$(git ls-remote origin "$ref")
          if [ -n "$existing" ]; then
            git fetch origin "$ref"
            git worktree add --detach "$root/store" FETCH_HEAD
          else
            git worktree add --detach "$root/store" HEAD
            git -C "$root/store" switch --orphan ex-evidence-archive-init
          fi
          IFS=, read -r -a ids <<< "$ARTIFACT_IDS"
          for id in "${ids[@]}"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$root/receipt.json"
            test "$(jq -r .id "$root/receipt.json")" = "$id"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$root/$id.zip"
            test "sha256:$(sha256sum "$root/$id.zip" | cut -d' ' -f1)" = "$(jq -r .digest "$root/receipt.json")"
            unzip -q "$root/$id.zip" -d "$root/input-$id"
            python ex_evidence_store.py --store "$root/store" seal --source "$root/input-$id" --receipt "$root/receipt.json"
          done
          git -C "$root/store" add objects records
          if ! git -C "$root/store" diff --cached --quiet; then
            git -C "$root/store" -c user.name=ex-evidence-bot -c user.email=ex-evidence-bot@users.noreply.github.com commit -m "Preserve EX evidence artifacts $ARTIFACT_IDS"
            for attempt in 1 2 3 4 5; do
              if git -C "$root/store" push origin "HEAD:$ref"; then exit 0; fi
              git -C "$root/store" fetch origin "$ref"
              if git -C "$root/store" merge-base HEAD FETCH_HEAD >/dev/null; then
                git -C "$root/store" -c user.name=ex-evidence-bot -c user.email=ex-evidence-bot@users.noreply.github.com rebase FETCH_HEAD
              else
                git -C "$root/store" -c user.name=ex-evidence-bot -c user.email=ex-evidence-bot@users.noreply.github.com rebase --root --onto FETCH_HEAD
              fi
              sleep "$attempt"
            done
            exit 1
          fi

  persist-scheduled-inventory:
    needs: inventory
    if: always() && (github.event_name == 'schedule' || inputs.persist_inventory) && needs.inventory.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.run_id }}
      WEEK_START: ${{ inputs.week_start }}
    steps:
      - run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "ex-weekly-capacity") | .id')
          test -n "$id"
          gh workflow run ex-weekly-evidence.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"             -f week_start="${WEEK_START:-$(date -u -d '7 days ago' +%F)}" -f artifact_ids="$id" -f preserve_only=true
