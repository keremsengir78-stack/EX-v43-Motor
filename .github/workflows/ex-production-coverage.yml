name: EX production evidence coverage
on:
  pull_request:
    branches: [ex-v43-development]
    paths: [.github/workflows/ex-production-coverage.yml, run_ex_production_coverage.py, run_ex_dutch_reconcile.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45561565207
          name: ex-approved-league-evidence
          path: dutch
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45469007220
          name: history-plan-1
          path: plan
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45471422307
          name: ex-retrospective-results
          path: retrospectives
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45555434697
          name: ex-prospective-forecasts
          path: day1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45561898364
          name: ex-prospective-forecasts
          path: day2
      - run: |
          python run_ex_dutch_reconcile.py --primary dutch/history/results.csv --as-of 2026-11-25 --output evidence/dutch
          python run_ex_production_coverage.py --plan plan/plan.json --examples retrospectives/retrospective-examples.jsonl --capture day1/capture.json day2/capture.json --output evidence/coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ex-production-coverage-evidence
          path: evidence/
