name: EX production evidence coverage
on:
  pull_request:
    branches: [ex-v43-development]
    paths: [.github/workflows/ex-production-coverage.yml, run_ex_production_coverage.py, run_ex_dutch_reconcile.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import re
          from urllib.request import urlopen
          for url in ["https://www.knvb.nl/competities/keuken-kampioen-divisie/uitslagen",
                      "https://www.fcupdate.nl/voetbalcompetities/nederland/keuken-kampioen-divisie/programma-uitslagen/2025-2026",
                      "https://www.fcupdate.nl/voetbalcompetities/nederland/keuken-kampioen-divisie/programma-uitslagen/2026-2027"]:
              try:
                  with urlopen(url,timeout=20) as r:
                      s=r.read(4500000).decode()
                      print(r.geturl(),len(s))
                  for term in ("__NEXT_DATA__", "homeScore", "uitwedstrijd", "Dordrecht", "2025-08-", "data-score"):
                      hits=list(re.finditer(term,s,re.I))
                      print(term,len(hits),[s[max(m.start()-100,0):m.end()+330] for m in hits[:2]])
              except OSError as e: print(type(e).__name__,e)
          PY
