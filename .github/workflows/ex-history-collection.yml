name: EX historical feature collection

on:
  workflow_dispatch:
    inputs:
      budget:
        description: Maximum source requests for this run
        default: "30"
        type: string
  pull_request:
    branches: [ex-v43-development]
    paths:
      - ex_history_archive.py
      - ex_history_sources.py
      - ex_uefa_provider.py
      - tests/test_history_collection.py
      - run_ex_history_collection.py
      - config/ex_history_pilot.json
      - .github/workflows/ex-history-collection.yml
  push:
    branches: [ex-v43-development]
    paths:
      - ex_history_archive.py
      - ex_history_sources.py
      - ex_uefa_provider.py
      - tests/test_history_collection.py
      - run_ex_history_collection.py
      - config/ex_history_pilot.json
      - .github/workflows/ex-history-collection.yml

permissions:
  contents: read

concurrency:
  group: ex-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: ex_history_cache
          key: ex-history-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ex-history-v1-${{ github.ref }}-
      - name: Collect bounded pilot
        env:
          REQUEST_BUDGET: ${{ inputs.budget || '20' }}
        run: |
          python run_ex_history_collection.py --config config/ex_history_pilot.json --cache ex_history_cache --output ex_history_report.json --budget "$REQUEST_BUDGET"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ex_history_cache
          key: ex-history-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ex-history-evidence
          path: |
            ex_history_report.json
            ex_history_cache/
