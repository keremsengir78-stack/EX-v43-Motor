name: EX UCL research ingestion
on:
  workflow_dispatch:
  push:
    branches: [ex-v43-development]
    paths: &ucl_paths
      - 'run_ucl_*.py'
      - 'ex_ucl_baseline.py'
      - 'ex_ucl_strength.py'
      - 'ex_espn_provider.py'
      - 'config/ucl_matchday5_2026_research.json'
      - 'research/ucl/**'
      - 'tests/test_ucl_research.py'
      - '.github/workflows/ex-ucl-research.yml'
  pull_request:
    branches: [ex-v43-development]
    paths: *ucl_paths
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python run_ucl_research.py
        id: ucl-source-check
        continue-on-error: true
      - run: python run_ucl_archive.py
      - run: python run_ucl_baselines.py
      - uses: actions/upload-artifact@v4
        with:
          name: ucl-archive-baselines
          path: ucl_research_output/
      - run: python run_ucl_domestic_candidates.py
      - run: python run_ucl_domestic.py
        continue-on-error: true
      - run: python run_ucl_baselines.py --backtest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ucl-research-evidence
          path: ucl_research_output/
      - name: Require corroborated UCL fixture and historical scores
        if: always() && steps.ucl-source-check.outcome != 'success'
        run: exit 1
