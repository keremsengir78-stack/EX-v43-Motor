name: EX public source discovery
on:
  pull_request:
    branches: [ex-v43-development]
    paths: [.github/workflows/ex16-discovery.yml]
permissions:
  contents: read
jobs:
  public-documents:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import re
          from urllib.request import urlopen,Request
          urls = {
              "pfl":"https://pfl.az/t%C9%99qvim/6807",
              "pfl-www":"https://www.pfl.az/t%C9%99qvim",
              "sk":"https://www.nikeliga.sk/zapasy",
              "cz":"https://www.chanceliga.cz/zapasy",
              "it":"https://en.legaseriea.it/team/roma/schedule",
              "fr":"https://ligue1.com/en/competitions/ligue1mcdonalds?tab=fixtures",
              "en":"https://www.premierleague.com/en/matches/premier-league/2026-27/matchweek-1",
          }
          from concurrent.futures import ThreadPoolExecutor
          def probe(item):
              name, url = item
              try:
                  with urlopen(Request(url,headers={"User-Agent":"EX-v4.3 evidence audit"}),timeout=12) as response:
                      raw = response.read(3000000).decode(errors="replace")
                      patterns={
                        "pfl": [r'<script[^>]+src=[^>]+>',r'/storage/games/files/[^" ]+pdf'],
                        "pfl-www": [r'<script[^>]+src=[^>]+>',r'/storage/games/files/[^" ]+pdf'],
                        "sk": [r'<a[^>]+href="[^"]*id_round[^"]*"[^>]*>',r'<a[^>]+href="/zapas/[^"]+"[^>]*>'],
                        "cz": [r'<a[^>]+href="/zapas/[^"]+"[^>]*>',r'<select[^>]*>'],
                        "it": ["Match completed", "__NEXT_DATA__", "kickOff", "Parma"],
                        "fr": ["__NEXT_DATA__", "fullTime", "fixtures", "homeTeam"],
                        "en": ["application/json", "type=.module", "dataLayer"],
                      }
                      hits={}
                      for pattern in patterns[name]:
                          scan=list(re.finditer(pattern,raw,re.I))
                          hits[pattern]=(len(scan),[raw[max(0,m.start()-35):m.end()+350] for m in scan[:2]])
                      return name,response.geturl(),len(raw),hits
              except Exception as e:
                  return name,str(e)
          with ThreadPoolExecutor(max_workers=3) as pool:
              for out in pool.map(probe,urls.items()):
                  print(out)
          PY
      - run: |
          python - <<'PY'
          import re
          from urllib.request import urlopen,Request
          files={
              "pfl-asset": ("https://pfl.az/assets/index-6f2caa04.js",[r'https?://[^"\x27\x60 ]+',r'Ke\.get\([^)]{1,130}\)',r'\.pdf',r'game_file']),
              "ita":("https://en.legaseriea.it/team/roma/schedule",[r'matchId',r'homeScore',r'awayScore',r'fixtures-results',r'fullTime',r'kickoff',r'eventStatus',r'dapi\.legaseriea\.it[^"\\ ]*(?:match|fixture)[^"\\ ]*']),
              "cz":("https://www.chanceliga.cz/zapas/8441-art-fkj",[r'href="[^"]*/statistiky/[^"]*"',r'\. Trenér:',r'Základní sestav']),
          }
          for name,(url,queries) in files.items():
              try:
                  with urlopen(Request(url,headers={"User-Agent":"EX-v4.3 evidence audit"}),timeout=10) as r:
                      body=r.read(5000000).decode(errors="replace")
                  for query in queries:
                      hits=list(re.finditer(query,body,re.I))
                      print(name,query,len(hits),[body[max(0,m.start()-70):m.end()+100] for m in hits[:10]])
              except OSError as e:
                  print(name,str(e))
          PY
      - run: |
          python - <<'PY'
          import json
          from urllib.request import Request,urlopen
          base="https://pfl.az/api/v1"
          def get(path):
              with urlopen(Request(base+path,headers={"User-Agent":"EX-v4.3 evidence audit","Accept-Language":"az","Accept":"application/json"}),timeout=12) as r:
                  return json.load(r)
          for path in ["/seasons?project_id=1","/games/show/6807?withActions=true"]:
              try:
                  payload=get(path)
                  data=payload["data"]
                  if isinstance(data,list):
                      print(path,json.dumps(data[:3],ensure_ascii=False)[:3500])
                      season=data[0]
                      leagues=season.get("leagues",[])
                      if leagues:
                          i=leagues[0]["id"]
                          res=get(f"/tours/get-games?league_id={i}")
                          print("tour",i,str(res)[:5500])
                  elif isinstance(data,dict):
                      print(path, list(data), {k:v for k,v in data.items() if not isinstance(v,(dict,list))})
                      for k,v in data.items():
                          if isinstance(v,dict): print(k,str(v)[:425])
              except Exception as e:
                  print(path,type(e).__name__,str(e))
          PY
      - run: |
          python - <<'PY'
          import re
          from urllib.request import urlopen
          for url in ["https://1ereannonce.lfp.fr/index.asp",
                      "https://www.premierleague.com/en/matchweek/2026_11/blog/saturday?tab=reporting",
                      "https://en.legaseriea.it/serie-a/match/97ef80e0aff84867ae6f6c53b2be31e5/parma-vs-roma",
                      "https://en.legaseriea.it/serie-a/fixtures-results"]:
              try:
                  with urlopen(url,timeout=10) as r: body = r.read(3000000).decode(errors="replace")
                  print(url,len(body))
                  for token in ["href=.{0,100}(?:pdf|result|JOURNEE)", "FULL.TIME Newcastle", "Match completed", "Full Time", "parma-vs-roma", "11-21"]:
                      hits=list(re.finditer(token,body,re.I))
                      print(token,len(hits),[body[max(m.start()-50,0):m.end()+135] for m in hits[:4]])
              except OSError as e: print(str(e))
          PY
      - run: |
          python - <<'PY'
          import json,re
          from urllib.request import urlopen
          for path in ["https://1ereannonce.lfp.fr/index.asp","https://en.legaseriea.it/serie-a","https://en.legaseriea.it/serie-a/match/97ef80e0aff84867ae6f6c53b2be31e5/parma-vs-roma"]:
              try:
                  with urlopen(path,timeout=10) as r: s=r.read(3000000).decode("utf8","replace")
                  print(path)
                  if "1ere" in path: print(s)
                  print("links", list(dict.fromkeys(re.findall(r'href="(/serie-a/match/[^"]+)"',s)))[:20])
                  print("json", [(len(x),x[:4000]) for x in re.findall(r'<script type="application/ld\+json">(.*?)</script>',s,re.S) if "SportsEvent" in x])
                  for q in ["matchStatus","matchState","\x221-5\x22","\x221 - 5\x22", "finished","eventDetails"]:
                      p=s.lower().find(q.lower())
                      if p>=0: print(q,s[max(p-80,0):p+240])
              except OSError as e: print(str(e))
          PY
      - run: |
          python - <<'PY'
          import json,re
          from urllib.parse import urlencode
          from urllib.request import Request,urlopen
          targets=[
              ("lfp-js", "https://1ereannonce.lfp.fr/js/dat.index.js", None),
              ("lfp-results","https://1ereannonce.lfp.fr/index.asp",urlencode({"code_evt":"D1","code_jr_tr":"J12"}).encode()),
              ("italy","https://en.legaseriea.it/serie-a",None),
          ]
          for name,url,data in targets:
              try:
                  with urlopen(Request(url,data=data),timeout=15) as h: s=h.read(5000000).decode(errors="replace")
                  if not name=="italy": print(name,s[:4000]);
                  else:
                      chunks=[]
                      for token in re.findall(r'<script>self\.__next_f\.push\((\[1,\s*".*?"\])\)</script>',s,re.S):
                          chunks.append(json.loads(token)[1])
                      body="".join(chunks)
                      loc=body.find('"providerStatus":"Finished"')
                      print("italy",len(chunks),body[loc-470:loc+6500])
              except OSError as e: print(name,str(e))
          PY
      - run: |
          python - <<'PY'
          import re,json
          from urllib.request import urlopen
          for url in ["https://ligue1.com/en/competitions/ligue1mcdonalds/results?gameweek=11","https://ligue1.com/fr/calendar/ligue1"]:
              try:
                  with urlopen(url,timeout=10) as r: body=r.read(3000000).decode(errors="replace"); print(url,r.geturl(),len(body))
                  found=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',body,re.S)
                  if found:
                      props=json.loads(found[1])["props"]["pageProps"]
                      print("next",list(props),json.dumps(props)[:1800])
                  for q in ["November", "Le Mans", "matchScore", "score", "matchday"]:
                      hit=re.search(q,body,re.I)
                      if hit: print(q,body[max(0,hit.start()-40):hit.end()+400])
              except OSError as e: print(str(e))
          PY
