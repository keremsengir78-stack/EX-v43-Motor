name: EX official evidence acquisition
on:
  pull_request:
    branches: [ex-v43-development]
    paths:
      - .github/workflows/ex-official-source-probe.yml
      - run_ex_official_sources.py
      - config/ex_official_sources.json
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python run_ex_official_sources.py --config config/ex_official_sources.json --output official-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: ex-official-evidence
          path: official-evidence/

  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45551884217
          name: ex-official-evidence
          path: archived
      - run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("archived")
          m=json.loads((root/"manifest.json").read_text())
          patterns={
            "cz-report": ["Jablonec:", "Slavia:", "73'"],
            "ua-report": ["Line-ups", "Ghram Alaa", "Bondar Valerii", "Substitutes"],
            "sk-report": ["Striedania", "Čerepkai", "Barseghjan", "Michalovce"],
            "sk-calendar": ["zapas/", "datetime=", "Tehelné"],
            "az-report": ["<title", "captcha"],
            "dfl-results": ["__NEXT_DATA__", "2026-11-20", "FCB", "scoreHome", "homeScore", "homeGoals",
                            "kickoff", "kickOff", "MatchDay", "endResult", "awayTeam"],
          }
          for key, terms in patterns.items():
            raw=(root/(m[key]["sha256"]+".html")).read_text(errors="replace")
            print(key)
            for term in terms:
              positions=list(re.finditer(re.escape(term),raw,re.I))
              print(term,len(positions))
              for p in positions[:1]: print(repr(raw[max(p.start()-90,0):p.end()+155]))
          PY
