name: EX official evidence acquisition
on:
  pull_request:
    branches: [ex-v43-development]
    paths:
      - .github/workflows/ex-official-source-probe.yml
      - run_ex_official_sources.py
      - config/ex_official_sources.json
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python run_ex_official_sources.py --config config/ex_official_sources.json --output official-evidence
      - name: Compare official Czech report to reviewed timeline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from run_ex_official_sources import extract_czech_report, read_evidence
          from run_ex_official_minutes_batch import normalize

          root = Path("official-evidence")
          entry = json.loads((root / "manifest.json").read_text())["cz-report"]
          fixture = json.loads(Path("research/ucl/domestic-minutes-czech-pilot.json").read_text())
          assert entry["url"] == entry["final_url"] == fixture["source"]
          labels = {"home": "Jablonec", "away": "Slavia"}
          parsed = extract_czech_report(read_evidence(root, entry), fixture, labels)
          assert not parsed["errors"], parsed["errors"]
          reviewed = normalize([fixture])
          for side in labels:
              actual = parsed["minutes"][0]["minutes"][side]
              expected = reviewed["minutes"][0]["minutes"][side]
              assert actual == {name.split(maxsplit=1)[1]: minutes
                                for name, minutes in expected.items()}, (actual, expected)
          print("Official Czech report: 32 player minute totals agree with reviewed timeline")
          PY
      - name: Identify official template fields
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from run_ex_official_sources import read_evidence

          root = Path("official-evidence")
          entries = json.loads((root / "manifest.json").read_text())
          fields = {
              "sk-report": ['class="sub">65', 'class="sub">', "Čerepkai", 'class="red'],
              "ua-report": ["Bondar Valerii", "Alefirenko", "Substitutions", "player-replace"],
              "ua-calendar": ["Shakhtar", "25.11.2026"],
              "sk-calendar": ['scoreboard__item__date', 'scoreboard__item__score'],
              "dfl-results": ['class="score"', "application/ld+json", "match-tile", "aria-label="],
          }
          for key, terms in fields.items():
              if "sha256" not in entries[key]:
                  print(key, entries[key])
                  continue
              page = read_evidence(root, entries[key])
              for term in terms:
                  matches = list(re.finditer(re.escape(term), page, re.I))
                  print(key, term, len(matches))
                  for match in matches[:2]:
                      print(repr(page[max(0,match.start()-370):match.end()+750]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ex-official-evidence
          path: official-evidence/
