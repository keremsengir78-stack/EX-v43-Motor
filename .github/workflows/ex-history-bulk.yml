name: EX bulk history

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: Calendar scope
        default: all
        options: [ucl, all, expanded]
  pull_request:
    branches: [ex-v43-development]
    paths:
      - .github/workflows/ex-history-bulk.yml
      - config/ex_history_bulk.json
      - config/ex_history_venues.json
      - ex_history_*.py
      - run_ex_history_collection.py
      - run_ex_history_merge.py
      - run_ex_history_scores.py
      - config/ex_history_expansion.json
      - tests/test_history_bulk.py

permissions:
  contents: read

concurrency:
  group: ex-history-bulk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calendars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: ex_history_cache
          key: ex-bulk-calendar-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ex-bulk-calendar-v1-${{ github.ref }}-
            ex-history-v1-${{ github.ref }}-
      - name: Collect deduplicated plan
        env:
          PROFILE: ${{ inputs.profile || 'expanded' }}
        run: |
          python run_ex_history_collection.py --config config/ex_history_bulk.json --profile "$PROFILE" --plan-only --cache ex_history_cache --output plan.json --budget 500 --request-interval 0.5
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ex_history_cache
          key: ex-bulk-calendar-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: history-calendar-evidence-${{ github.run_attempt }}
          path: ex_history_cache/
      - uses: actions/upload-artifact@v4
        with:
          name: history-plan-${{ github.run_attempt }}
          path: plan.json

  summaries:
    needs: calendars
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: history-plan-${{ github.run_attempt }}
      - uses: actions/cache/restore@v4
        with:
          path: ex_history_cache
          key: ex-bulk-shard-v1-${{ github.ref }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ex-bulk-shard-v1-${{ github.ref }}-${{ matrix.shard }}-
            ex-history-v1-${{ github.ref }}-
      - run: python run_ex_history_collection.py --plan plan.json --cache ex_history_cache --output "part-${{ matrix.shard }}.json" --shard "${{ matrix.shard }}" --shards 8 --budget 170 --request-interval 0.5
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ex_history_cache
          key: ex-bulk-shard-v1-${{ github.ref }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: history-part-${{ github.run_attempt }}-${{ matrix.shard }}
          path: part-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: history-summary-evidence-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ex_history_cache/

  coverage:
    needs: summaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: history-plan-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        with:
          pattern: history-part-${{ github.run_attempt }}-*
          path: parts
          merge-multiple: true
      - uses: actions/cache/restore@v4
        with:
          path: weather_cache
          key: ex-bulk-weather-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ex-bulk-weather-v1-${{ github.ref }}-
      - run: python run_ex_history_merge.py --plan plan.json --parts parts --cache weather_cache --venues config/ex_history_venues.json --output history-coverage.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: weather_cache
          key: ex-bulk-weather-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: history-coverage-${{ github.run_attempt }}
          path: |
            history-coverage.json
            weather_cache/

  score-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: score_cache
          key: ex-bulk-score-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ex-bulk-score-v1-${{ github.ref }}-
      - name: Build baseline queues and collect score evidence
        run: |
          python ex_one_command.py --as-of 2026-11-24 --seasons 2025-26 2026-27 --leagues en.1 de.1 es.1 it.1 fr.1 --outdir score_input
          python run_ex_history_scores.py --data score_input --as-of 2026-11-24 --aliases config/premier_reviewed_aliases.json --cache score_cache --budget 450 --output score-evidence.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: score_cache
          key: ex-bulk-score-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-score-evidence-${{ github.run_attempt }}
          path: |
            score_input/
            score_cache/
            score-evidence.json
