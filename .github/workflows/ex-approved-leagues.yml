name: EX approved league linkage
on:
  pull_request:
    branches: [ex-v43-development]
    paths: [.github/workflows/ex-approved-leagues.yml, ex_leagues.py, ex_live_data.py, ex_engine.py, run_ex_league_coverage.py]
permissions:
  contents: read
jobs:
  approved-leagues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare public ESPN query forms
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json
          from ex_history_archive import download
          from ex_history_sources import ESPN
          def check(pair):
              league, query = pair
              try:
                  body = json.loads(download(f"{ESPN}/{league}/scoreboard?{query}"))
                  return league, query, len(body["events"]), sorted({e["status"]["type"]["name"] for e in body["events"]})
              except (OSError,ValueError) as e:
                  return league,query,str(e)
          params = ["dates=20261120", "dates=20261101-20261124", "dates=20261101-20261124&limit=100",
                    "dates=20250701-20260630", "dates=20250701-20260630&limit=500"]
          with ThreadPoolExecutor(max_workers=3) as p:
              for row in p.map(check, [(k,q) for k in ("ned.2","nor.1","uefa.champions") for q in params]):
                  print(row)
          PY
      - run: |
          mkdir -p approved-evidence
          python run_ex_league_coverage.py > approved-evidence/coverage.json
          python ex_live_data.py --seasons 2025-26 2026-27 --leagues nl.2 no.1 UCL --as-of 2026-11-25 --outdir approved-evidence/history
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("approved-evidence/history/audit.json").read_text())
          print(json.dumps(audit["sources"]))
          assert len(audit["sources"]) == 6
          assert all(s.get("rows_before_cutoff", 0) > 0 for s in audit["sources"]), audit["sources"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ex-approved-league-evidence
          path: approved-evidence/
