name: EX league minutes collection
on:
  pull_request:
    branches: [ex-v43-development]
    paths: [.github/workflows/ex-league-minutes.yml, run_ex_league_minutes.py, run_ex_pfl_discovery.py, ex_official_calendar.py, ex_official_report_html.py, run_ex_official_sources.py]
  workflow_dispatch:
    inputs:
      offset:
        type: number
        default: 0
      limit:
        type: number
        default: 20
      resume_run_id:
        type: string
        description: Optional earlier run containing verified raw report captures
permissions:
  contents: read
  actions: read
jobs:
  minutes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
          name: ex-league-minutes
          path: official-minutes
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - env:
          OFFSET: ${{ inputs.offset || '0' }}
          LIMIT: ${{ inputs.limit || '8' }}
        run: |
          python run_ex_league_minutes.py --output official-minutes --limit "$LIMIT" --offset "$OFFSET"
          python run_ex_pfl_discovery.py --output official-minutes/pfl --limit "$LIMIT" --offset "$OFFSET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ex-league-minutes
          path: official-minutes/
