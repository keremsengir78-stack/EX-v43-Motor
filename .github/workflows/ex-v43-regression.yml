name: EX v4.3 regression
on:
  push:
    branches: [ex-v43-development]
  pull_request:
    branches: [main, ex-v43-development]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax check
        id: syntax
        run: python -m compileall -q .
      - name: Isolated safety gates
        id: safety
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_safety_gates.py' -v 2>&1 | tee safety-gates.log
      - name: Full unittest regression
        id: full
        if: success()
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test*.py' -v 2>&1 | tee full-regression.log
      - name: Audit actual 1177 review exports
        id: review_audit
        if: success()
        run: |
          set -o pipefail
          python run_strict_review_export_audit.py 2>&1 | tee strict-review-export-audit.log
      - name: Audit actual 75 external score candidates
        id: external_audit
        if: success()
        run: |
          set -o pipefail
          python run_external_candidate_integrity_audit.py 2>&1 | tee external-candidate-audit.log
      - name: Publish regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ex-v43-regression-logs
          path: |
            safety-gates.log
            full-regression.log
            strict-review-export-audit.log
            external-candidate-audit.log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish machine-readable commit regression status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          SYNTAX_RESULT: ${{ steps.syntax.outcome }}
          SAFETY_RESULT: ${{ steps.safety.outcome }}
          FULL_RESULT: ${{ steps.full.outcome }}
          REVIEW_AUDIT_RESULT: ${{ steps.review_audit.outcome }}
          EXTERNAL_AUDIT_RESULT: ${{ steps.external_audit.outcome }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
          else
            state=failure
          fi
          if [ "$FULL_RESULT" = "failure" ] && [ -f full-regression.log ]; then
            failure_lines=$(grep -E '^(FAIL|ERROR): ' full-regression.log | head -n 3 | tr '\n' ';' || true)
            if [ -z "$failure_lines" ]; then
              failure_lines=$(grep -E '^(FAILED|ImportError|ModuleNotFoundError):?' full-regression.log | head -n 2 | tr '\n' ';' || true)
            fi
            if [ -z "$failure_lines" ]; then
              failure_lines="Full regression failed; inspect workflow log"
            fi
            gh api "repos/$GH_REPO/statuses/$GITHUB_SHA" \
              -f state=failure \
              -f context="ex-v43/full-diagnostic" \
              -f description="${failure_lines:0:140}"
            diagnostic=$(printf "%s" "$failure_lines" | cut -d";" -f1 | sed -E 's/[^A-Za-z0-9_.:-]+/_/g' | cut -c1-90)
            gh api "repos/$GH_REPO/statuses/$GITHUB_SHA" \
              -f state=failure \
              -f context="ex-v43/failing-test/$diagnostic" \
              -f description="First full regression failure identifier"
          fi
          for item in "syntax:$SYNTAX_RESULT" "safety:$SAFETY_RESULT" "full:$FULL_RESULT" "review-audit:$REVIEW_AUDIT_RESULT" "external-audit:$EXTERNAL_AUDIT_RESULT"; do
            stage="${item%%:*}"
            outcome="${item#*:}"
            case "$outcome" in
              success) stage_state=success ;;
              failure|cancelled) stage_state=failure ;;
              *) stage_state=pending ;;
            esac
            gh api "repos/$GH_REPO/statuses/$GITHUB_SHA" \
              -f state="$stage_state" \
              -f context="ex-v43/$stage" \
              -f description="Stage outcome: $outcome"
          done
          gh api "repos/$GH_REPO/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="ex-v43/regression" \
            -f description="EX v4.3 syntax, safety, full tests and both export audits"
