name: EX review evidence sync
on:
  push:
    branches: [ex-v43-development]
    paths-ignore:
      - 'reports/**'
      - 'docs/EX_CONTINUITY.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ex-review-sync
  cancel-in-progress: false
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ex-v43-development
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify review tools
        run: python -m unittest tests.test_secondary_review_summary tests.test_germany_review_export tests.test_cross_verify_full_evidence tests.test_germany_alias_candidates tests.test_germany_alias_pilot tests.test_germany_shadow_offline tests.test_germany_shadow_metrics tests.test_germany_shadow_remaining tests.test_germany_remaining_candidates tests.test_germany_shadow_merge tests.test_germany_expanded_validation tests.test_multileague_alias_candidates tests.test_multileague_shadow_map tests.test_multileague_diagnostics tests.test_multileague_review_queue tests.test_multileague_queue_validation tests.test_multileague_shadow_validation tests.test_multileague_priority_plan tests.test_multileague_priority_validation tests.test_multileague_review_batches tests.test_multileague_batch_validation tests.test_multileague_batch_manifest tests.test_multileague_manifest_validation tests.test_multileague_evidence_ledger tests.test_multileague_evidence_validation tests.test_multileague_candidate_resolution tests.test_multileague_candidate_summary tests.test_multileague_unique_candidates tests.test_multileague_strict_score_reconcile -v
      - name: Collect real source audit
        id: ingest
        continue-on-error: true
        shell: bash
        run: |
          python ex_one_command.py --as-of "$(date -u +%F)" --seasons 2025-26 2026-27 --leagues en.1 de.1 es.1 it.1 fr.1 --outdir ex_run
      - name: Generate guarded evidence
        id: review
        continue-on-error: true
        shell: bash
        run: |
          python ex_secondary_review_summary.py --audit ex_run/audit.json --out ex_run/secondary_review_summary.json
          python ex_germany_review_export.py --audit ex_run/audit.json --out ex_run/germany_unresolved_review.csv
      - name: Extract non-German review-only alias candidates
        id: other_leagues
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f ex_run/secondary_review_summary.json ]; then
            python ex_multileague_alias_candidates.py --summary ex_run/secondary_review_summary.json --out ex_run/multileague_alias_candidates.json
            python ex_multileague_diagnostics.py --summary ex_run/secondary_review_summary.json --out ex_run/multileague_diagnostics.json
            python ex_multileague_review_queue.py --summary ex_run/secondary_review_summary.json --limit 100 --out ex_run/multileague_review_queue.json
          fi
      - name: Quarantined non-German shadow comparison
        id: other_shadow
        if: always()
        continue-on-error: false
        shell: bash
        run: |
          if [ -f ex_run/multileague_alias_candidates.json ]; then
            python ex_multileague_shadow_map.py --candidates ex_run/multileague_alias_candidates.json --out ex_run/multileague_shadow_aliases.json
            python ex_one_command.py --as-of "$(date -u +%F)" --seasons 2025-26 2026-27 --leagues en.1 es.1 it.1 fr.1 --secondary-aliases ex_run/multileague_shadow_aliases.json --outdir ex_other_shadow
            python ex_secondary_review_summary.py --audit ex_other_shadow/audit.json --out ex_other_shadow/review_summary.json
            python ex_multileague_review_queue.py --summary ex_other_shadow/review_summary.json --limit 100 --out ex_run/multileague_shadow_review_queue.json
            python ex_multileague_diagnostics.py --summary ex_other_shadow/review_summary.json --out ex_run/multileague_shadow_diagnostics.json
            python ex_multileague_priority_plan.py --summary ex_other_shadow/review_summary.json --out ex_run/multileague_priority_plan.json
            python ex_multileague_review_batches.py --summary ex_other_shadow/review_summary.json --batch-size 50 --out ex_run/multileague_review_batches.json
            python ex_multileague_batch_manifest.py --batches ex_run/multileague_review_batches.json --out ex_run/multileague_batch_manifest.json
            python ex_multileague_evidence_ledger.py --batches ex_run/multileague_review_batches.json --batch-id 1 --out ex_run/multileague_evidence_ledger_batch1.json
            # Retry transient provider/network failures, never manufacture score approvals.
            for attempt in 1 2 3; do
              if python ex_multileague_candidate_resolution.py --batches ex_run/multileague_review_batches.json --out ex_run/multileague_source_candidates.json; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::Source candidate resolution failed after three attempts"
                exit 1
              fi
              sleep $((attempt * 10))
            done
            python ex_multileague_candidate_summary.py --candidates ex_run/multileague_source_candidates.json --out ex_run/multileague_candidate_summary.json
            python ex_multileague_unique_candidates.py --candidates ex_run/multileague_source_candidates.json --out ex_run/multileague_unique_candidates.json
            python ex_multileague_strict_score_reconcile.py --batches ex_run/multileague_review_batches.json --primary ex_run/results.csv --out ex_run/multileague_strict_score_reconcile.json
            python - <<'PY'
          import json
          from pathlib import Path
          candidate=json.loads(Path("ex_run/multileague_source_candidates.json").read_text(encoding="utf-8"))
          summary=json.loads(Path("ex_run/multileague_candidate_summary.json").read_text(encoding="utf-8"))
          unique=json.loads(Path("ex_run/multileague_unique_candidates.json").read_text(encoding="utf-8"))
          assert candidate["total_fixtures"] == summary["total_fixtures"] == unique["total_fixtures"]
          assert candidate["with_candidates"] == summary["with_candidates"]
          assert unique["unique_name_candidates"] <= summary["high_name_similarity_candidates"]
          assert not any(x.get("independent_score_verified") for x in unique["records"])
          print("SOURCE_CANDIDATE_COUNTS",json.dumps({"total":candidate["total_fixtures"],"same_day":summary["with_candidates"],"high_similarity":summary["high_name_similarity_candidates"],"unique":unique["unique_name_candidates"],"unmatched":unique["remaining_for_manual_review"]}))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path("ex_run/audit.json").read_text(encoding="utf-8"))
          shadow=json.loads(Path("ex_other_shadow/audit.json").read_text(encoding="utf-8"))
          by_league=shadow.get("secondary_unmatched_by_season",{})
          result={"baseline_unmatched":sum(v for k,v in base.get("secondary_unmatched_by_season",{}).items() if not k.endswith("/de.1")),
                  "shadow_unmatched":shadow.get("secondary_unverified"),
                  "shadow_unmatched_by_league":{league:sum(v for k,v in by_league.items() if k.endswith("/"+league)) for league in ("en.1","es.1","it.1","fr.1")},
                  "score_conflicts":shadow.get("secondary_conflicts"),
                  "source_errors":shadow.get("secondary_source_errors",[]),
                  "comparison_only":True,"aliases_approved":False,
                  "independently_verified_added":0,"ex_final_allowed":False}
          Path("ex_run/multileague_shadow_comparison.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+chr(10),encoding="utf-8")
          PY
          fi
      - name: Extract German manual alias candidates
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f ex_run/germany_unresolved_review.csv ]; then
            python ex_germany_alias_candidates.py --csv ex_run/germany_unresolved_review.csv --out ex_run/germany_alias_candidates.json
          fi
      - name: Offline German candidate coverage
        id: offline_shadow
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f ex_run/germany_unresolved_review.csv ] && [ -f ex_run/germany_alias_candidates.json ]; then
            python ex_germany_shadow_offline.py --csv ex_run/germany_unresolved_review.csv --candidates ex_run/germany_alias_candidates.json --out ex_run/germany_offline_shadow.json
          fi
      - name: Quarantined German alias shadow comparison
        id: shadow
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f ex_run/germany_alias_candidates.json ]; then
            python ex_germany_alias_pilot.py --candidates ex_run/germany_alias_candidates.json --out ex_run/germany_shadow_aliases.json
            python ex_one_command.py --as-of "$(date -u +%F)" --seasons 2025-26 2026-27 --leagues de.1 --secondary-aliases ex_run/germany_shadow_aliases.json --outdir ex_germany_shadow
            python ex_germany_shadow_remaining.py --audit ex_germany_shadow/audit.json --out ex_run/germany_shadow_remaining.json
            python ex_germany_remaining_candidates.py --remaining ex_run/germany_shadow_remaining.json --known-candidates ex_run/germany_alias_candidates.json --out ex_run/germany_remaining_candidates.json
            python - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path("ex_run/audit.json").read_text(encoding="utf-8"))
          shadow=json.loads(Path("ex_germany_shadow/audit.json").read_text(encoding="utf-8"))
          base_count=sum(x.get("comparison",{}).get("unmatched",0) for x in baseline.get("secondary_audits",[]) if x.get("league")=="de.1")
          result={"baseline_germany_unmatched":base_count,
                  "shadow_germany_unmatched":shadow.get("secondary_unverified"),
                  "shadow_score_conflicts":shadow.get("secondary_conflicts"),
                  "shadow_source_errors":shadow.get("secondary_source_errors",[]),
                  "comparison_only":True, "aliases_approved":False,
                  "ex_final_allowed":False}
          Path("ex_run/germany_shadow_comparison.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+chr(10),encoding="utf-8")
          print(json.dumps(result))
          PY
          fi
      - name: Expanded 18-candidate German shadow
        id: expanded_shadow
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f ex_run/germany_remaining_candidates.json ] && [ -f ex_run/germany_alias_candidates.json ]; then
            python ex_germany_shadow_merge.py --first ex_run/germany_alias_candidates.json --second ex_run/germany_remaining_candidates.json --out ex_run/germany_expanded_candidates.json
            python ex_germany_alias_pilot.py --candidates ex_run/germany_expanded_candidates.json --out ex_run/germany_expanded_aliases.json
            python ex_one_command.py --as-of "$(date -u +%F)" --seasons 2025-26 2026-27 --leagues de.1 --secondary-aliases ex_run/germany_expanded_aliases.json --outdir ex_germany_expanded
            python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path("ex_germany_expanded/audit.json").read_text(encoding="utf-8"))
          report={"expanded_shadow_unmatched":audit.get("secondary_unverified"),
                  "expanded_shadow_score_conflicts":audit.get("secondary_conflicts"),
                  "expanded_shadow_source_errors":audit.get("secondary_source_errors",[]),
                  "candidate_count":18,"comparison_only":True,
                  "aliases_approved":False,"independently_verified_added":0,
                  "ex_final_allowed":False}
          Path("ex_run/germany_expanded_shadow.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+chr(10),encoding="utf-8")
          PY
          fi
      - name: Confirm candidate outputs immediately
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          names=("multileague_source_candidates","multileague_candidate_summary","multileague_unique_candidates")
          for name in names:
              path=Path("ex_run")/(name+".json")
              if not path.is_file():
                  raise SystemExit("SOURCE_MATCHING_MISSING: "+str(path))
              report=json.loads(path.read_text(encoding="utf-8"))
              print("SOURCE_MATCHING_RESULT",name,{k:v for k,v in report.items() if k in ("total_fixtures","with_candidates","without_candidates","high_name_similarity_candidates","unique_name_candidates","remaining_for_manual_review","independently_verified_added")})
          PY
      - name: Persist real review evidence and diagnostic status
        if: always()
        env:
          INGEST: ${{ steps.ingest.outcome }}
          REVIEW: ${{ steps.review.outcome }}
          SHADOW: ${{ steps.shadow.outcome }}
          OFFLINE_SHADOW: ${{ steps.offline_shadow.outcome }}
          EXPANDED_SHADOW: ${{ steps.expanded_shadow.outcome }}
          OTHER_LEAGUES: ${{ steps.other_leagues.outcome }}
          OTHER_SHADOW: ${{ steps.other_shadow.outcome }}
        shell: bash
        run: |
          mkdir -p reports
          if [ "${{ steps.ingest.outcome }}" = "skipped" ]; then
            echo "Ingest skipped; refusing stale diagnostic publication"
            exit 1
          fi
          python ex_publish_review_evidence.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest_pipeline_status.json
          for report in reports/latest_secondary_review_summary.json reports/latest_germany_unresolved_review.csv reports/latest_germany_alias_candidates.json reports/latest_germany_shadow_comparison.json reports/latest_germany_offline_shadow.json reports/latest_germany_shadow_validated_metrics.json reports/latest_germany_shadow_remaining.json reports/latest_germany_remaining_candidates.json reports/latest_germany_expanded_shadow.json reports/latest_germany_expanded_validated.json reports/latest_multileague_alias_candidates.json reports/latest_multileague_shadow_comparison.json reports/latest_multileague_diagnostics.json reports/latest_multileague_review_queue.json reports/latest_multileague_queue_validated.json reports/latest_multileague_shadow_review_queue.json reports/latest_multileague_shadow_diagnostics.json reports/latest_multileague_shadow_validated.json reports/latest_multileague_priority_plan.json reports/latest_multileague_priority_validated.json reports/latest_multileague_review_batches.json reports/latest_multileague_batches_validated.json reports/latest_multileague_batch_manifest.json reports/latest_multileague_manifest_validated.json reports/latest_multileague_evidence_ledger_batch1.json reports/latest_multileague_evidence_validated_batch1.json reports/latest_multileague_source_candidates.json reports/latest_multileague_candidate_summary.json reports/latest_multileague_unique_candidates.json reports/latest_multileague_strict_score_reconcile.json; do
            if [ -f "$report" ]; then git add "$report"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Sync audited review evidence and pipeline diagnostic [skip ci]'
            git pull --rebase origin ex-v43-development
            git push origin HEAD:ex-v43-development
          fi
      - name: Fail if audited evidence could not be published
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/latest_pipeline_status.json")
          if not p.is_file():
              raise SystemExit("Missing pipeline diagnostic")
          s=json.loads(p.read_text(encoding="utf-8"))
          if str(s.get("run_id")) != "${{ github.run_id }}":
              raise SystemExit("Stale diagnostic belongs to a different workflow run")
          for required_report in ("reports/latest_multileague_candidate_summary.json", "reports/latest_multileague_unique_candidates.json"):
              if not Path(required_report).is_file():
                  raise SystemExit("Required measurable source report not published: "+required_report)
          if s.get("ingest_step")!="success" or s.get("review_step")!="success" or s.get("evidence_published") is not True:
              raise SystemExit("Audit pipeline failed: "+json.dumps(s))
          if s.get("shadow_step")!="success" or s.get("offline_shadow_step")!="success":
              raise SystemExit("Shadow comparison step failed: "+json.dumps(s))
          if not s.get("shadow_comparison_exists") or s.get("germany_name_only_candidates") is None or s.get("germany_shadow_reduction") is None or s.get("germany_shadow_remaining_count") is None or s.get("germany_remaining_alias_candidates") is None or s.get("germany_expanded_shadow_unmatched") is None or s.get("germany_expanded_validated") is not True or s.get("non_germany_alias_candidates") is None or s.get("other_leagues_step")!="success" or s.get("other_shadow_step")!="success" or s.get("non_germany_shadow_unmatched") is None or s.get("non_germany_diagnostics_published") is not True or s.get("non_germany_review_queue_published") is not True or s.get("non_germany_queue_validated") is not True or s.get("non_germany_shadow_review_queue_published") is not True or s.get("non_germany_shadow_diagnostics_published") is not True or s.get("non_germany_shadow_validated") is not True or s.get("non_germany_priority_plan_published") is not True or s.get("non_germany_priority_validated") is not True or s.get("non_germany_review_batches_published") is not True or s.get("non_germany_review_batches_validated") is not True or s.get("non_germany_batch_manifest_published") is not True or s.get("non_germany_batch_manifest_validated") is not True or s.get("non_germany_evidence_ledger_published") is not True or s.get("non_germany_evidence_ledger_validated") is not True or s.get("non_germany_source_candidates_published") is not True or s.get("non_germany_candidate_summary_published") is not True or s.get("non_germany_unique_candidates_published") is not True:
              raise SystemExit("Missing shadow comparison output: "+json.dumps(s))
          PY
      - name: Upload evidence even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ex-review-evidence-${{ github.run_id }}
          path: ex_run/
          if-no-files-found: warn
          retention-days: 30
