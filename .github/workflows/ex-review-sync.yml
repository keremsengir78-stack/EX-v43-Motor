name: EX review evidence sync
on:
  push:
    branches: [ex-v43-development]
    paths-ignore:
      - 'reports/**'
      - 'docs/EX_CONTINUITY.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ex-review-sync
  cancel-in-progress: false
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ex-v43-development
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify review tools
        run: python -m unittest tests.test_secondary_review_summary tests.test_germany_review_export -v
      - name: Collect real source audit
        shell: bash
        run: |
          python ex_one_command.py --as-of "$(date -u +%F)" --seasons 2025-26 2026-27 --leagues en.1 de.1 es.1 it.1 fr.1 --outdir ex_run
      - name: Generate guarded evidence
        shell: bash
        run: |
          python ex_secondary_review_summary.py --audit ex_run/audit.json --out ex_run/secondary_review_summary.json
          python ex_germany_review_export.py --audit ex_run/audit.json --out ex_run/germany_unresolved_review.csv
      - name: Persist real review evidence
        shell: bash
        run: |
          mkdir -p reports
          cp ex_run/secondary_review_summary.json reports/latest_secondary_review_summary.json
          cp ex_run/germany_unresolved_review.csv reports/latest_germany_unresolved_review.csv
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("reports/latest_secondary_review_summary.json").read_text(encoding="utf-8"))
          if a.get("ex_final_allowed") is not False:
              raise SystemExit("Unsafe review data: EX FINAL not explicitly blocked")
          print("Real unresolved:",a["unmatched_total"],"Germany:",a["germany_unmatched"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest_secondary_review_summary.json reports/latest_germany_unresolved_review.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Sync independently audited unresolved review evidence [skip ci]'
            git pull --rebase origin ex-v43-development
            git push origin HEAD:ex-v43-development
          fi
      - name: Upload evidence even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ex-review-evidence-${{ github.run_id }}
          path: ex_run/
          if-no-files-found: warn
          retention-days: 30
