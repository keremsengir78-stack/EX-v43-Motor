name: EX review evidence sync
on:
  push:
    branches: [ex-v43-development]
    paths-ignore:
      - 'reports/**'
      - 'docs/EX_CONTINUITY.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ex-review-sync
  cancel-in-progress: false
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ex-v43-development
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify review tools
        run: python -m unittest tests.test_secondary_review_summary tests.test_germany_review_export tests.test_cross_verify_full_evidence tests.test_germany_alias_candidates tests.test_germany_alias_pilot tests.test_germany_shadow_offline tests.test_germany_shadow_metrics tests.test_germany_shadow_remaining tests.test_germany_remaining_candidates tests.test_germany_shadow_merge -v
      - name: Collect real source audit
        id: ingest
        continue-on-error: true
        shell: bash
        run: |
          python ex_one_command.py --as-of "$(date -u +%F)" --seasons 2025-26 2026-27 --leagues en.1 de.1 es.1 it.1 fr.1 --outdir ex_run
      - name: Generate guarded evidence
        id: review
        continue-on-error: true
        shell: bash
        run: |
          python ex_secondary_review_summary.py --audit ex_run/audit.json --out ex_run/secondary_review_summary.json
          python ex_germany_review_export.py --audit ex_run/audit.json --out ex_run/germany_unresolved_review.csv
      - name: Extract German manual alias candidates
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f ex_run/germany_unresolved_review.csv ]; then
            python ex_germany_alias_candidates.py --csv ex_run/germany_unresolved_review.csv --out ex_run/germany_alias_candidates.json
          fi
      - name: Offline German candidate coverage
        id: offline_shadow
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f ex_run/germany_unresolved_review.csv ] && [ -f ex_run/germany_alias_candidates.json ]; then
            python ex_germany_shadow_offline.py --csv ex_run/germany_unresolved_review.csv --candidates ex_run/germany_alias_candidates.json --out ex_run/germany_offline_shadow.json
          fi
      - name: Quarantined German alias shadow comparison
        id: shadow
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f ex_run/germany_alias_candidates.json ]; then
            python ex_germany_alias_pilot.py --candidates ex_run/germany_alias_candidates.json --out ex_run/germany_shadow_aliases.json
            python ex_one_command.py --as-of "$(date -u +%F)" --seasons 2025-26 2026-27 --leagues de.1 --secondary-aliases ex_run/germany_shadow_aliases.json --outdir ex_germany_shadow
            python ex_germany_shadow_remaining.py --audit ex_germany_shadow/audit.json --out ex_run/germany_shadow_remaining.json
            python ex_germany_remaining_candidates.py --remaining ex_run/germany_shadow_remaining.json --known-candidates ex_run/germany_alias_candidates.json --out ex_run/germany_remaining_candidates.json
            python - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path("ex_run/audit.json").read_text(encoding="utf-8"))
          shadow=json.loads(Path("ex_germany_shadow/audit.json").read_text(encoding="utf-8"))
          base_count=sum(x.get("comparison",{}).get("unmatched",0) for x in baseline.get("secondary_audits",[]) if x.get("league")=="de.1")
          result={"baseline_germany_unmatched":base_count,
                  "shadow_germany_unmatched":shadow.get("secondary_unverified"),
                  "shadow_score_conflicts":shadow.get("secondary_conflicts"),
                  "shadow_source_errors":shadow.get("secondary_source_errors",[]),
                  "comparison_only":True, "aliases_approved":False,
                  "ex_final_allowed":False}
          Path("ex_run/germany_shadow_comparison.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+chr(10),encoding="utf-8")
          print(json.dumps(result))
          PY
          fi
      - name: Expanded 18-candidate German shadow
        id: expanded_shadow
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f ex_run/germany_remaining_candidates.json ] && [ -f ex_run/germany_alias_candidates.json ]; then
            python ex_germany_shadow_merge.py --first ex_run/germany_alias_candidates.json --second ex_run/germany_remaining_candidates.json --out ex_run/germany_expanded_candidates.json
            python ex_germany_alias_pilot.py --candidates ex_run/germany_expanded_candidates.json --out ex_run/germany_expanded_aliases.json
            python ex_one_command.py --as-of "$(date -u +%F)" --seasons 2025-26 2026-27 --leagues de.1 --secondary-aliases ex_run/germany_expanded_aliases.json --outdir ex_germany_expanded
            python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path("ex_germany_expanded/audit.json").read_text(encoding="utf-8"))
          report={"expanded_shadow_unmatched":audit.get("secondary_unverified"),
                  "expanded_shadow_score_conflicts":audit.get("secondary_conflicts"),
                  "expanded_shadow_source_errors":audit.get("secondary_source_errors",[]),
                  "candidate_count":18,"comparison_only":True,
                  "aliases_approved":False,"independently_verified_added":0,
                  "ex_final_allowed":False}
          Path("ex_run/germany_expanded_shadow.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+chr(10),encoding="utf-8")
          PY
          fi
      - name: Persist real review evidence and diagnostic status
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          from pathlib import Path
          status={"ingest_step":"${{ steps.ingest.outcome }}",
                  "review_step":"${{ steps.review.outcome }}",
                  "shadow_step":"${{ steps.shadow.outcome }}",
                  "offline_shadow_step":"${{ steps.offline_shadow.outcome }}",
                  "expanded_shadow_step":"${{ steps.expanded_shadow.outcome }}",
                  "source_audit_exists":Path("ex_run/audit.json").is_file(),
                  "summary_exists":Path("ex_run/secondary_review_summary.json").is_file(),
                  "germany_csv_exists":Path("ex_run/germany_unresolved_review.csv").is_file(),
                  "ex_final_allowed":False,
                  "commit":"${{ github.sha }}",
                  "run_id":"${{ github.run_id }}"}
          audit=Path("ex_run/audit.json")
          if audit.is_file():
              try:
                  data=json.loads(audit.read_text(encoding="utf-8"))
                  status["audit_status"]=data.get("status")
                  status["source_errors"]=data.get("secondary_source_errors",[])
              except (ValueError, OSError) as exc:
                  status["audit_read_error"]=str(exc)
          shadow_path=Path("ex_run/germany_shadow_comparison.json")
          status["shadow_comparison_exists"]=shadow_path.is_file()
          if status["summary_exists"] and status["germany_csv_exists"]:
              try:
                  summary=json.loads(Path("ex_run/secondary_review_summary.json").read_text(encoding="utf-8"))
                  if summary.get("ex_final_allowed") is not False:
                      raise ValueError("EX FINAL lock not explicit")
                  status["unmatched_total"]=summary["unmatched_total"]
                  status["germany_unmatched"]=summary["germany_unmatched"]
                  Path("reports/latest_secondary_review_summary.json").write_bytes(
                      Path("ex_run/secondary_review_summary.json").read_bytes())
                  Path("reports/latest_germany_unresolved_review.csv").write_bytes(
                      Path("ex_run/germany_unresolved_review.csv").read_bytes())
                  status["evidence_published"]=True
                  offline_path=Path("ex_run/germany_offline_shadow.json")
                  if offline_path.is_file():
                      offline=json.loads(offline_path.read_text(encoding="utf-8"))
                      if offline.get("ex_final_allowed") is not False or offline.get("verified_score_matches_added") != 0:
                          raise ValueError("Unsafe offline candidate evidence")
                      Path("reports/latest_germany_offline_shadow.json").write_bytes(offline_path.read_bytes())
                      status["germany_name_only_candidates"]=offline.get("unique_name_only_candidates")
                  remaining_path=Path("ex_run/germany_shadow_remaining.json")
                  if remaining_path.is_file():
                      remaining=json.loads(remaining_path.read_text(encoding="utf-8"))
                      if remaining.get("ex_final_allowed") is not False or remaining.get("aliases_approved") is not False:
                          raise ValueError("Unsafe remaining shadow evidence")
                      Path("reports/latest_germany_shadow_remaining.json").write_bytes(remaining_path.read_bytes())
                      status["germany_shadow_remaining_count"]=remaining["unmatched_total"]
                  new_candidates_path=Path("ex_run/germany_remaining_candidates.json")
                  if new_candidates_path.is_file():
                      new_candidates=json.loads(new_candidates_path.read_text(encoding="utf-8"))
                      if new_candidates.get("ex_final_allowed") is not False or new_candidates.get("score_verified") is not False:
                          raise ValueError("Unsafe remaining alias candidate evidence")
                      Path("reports/latest_germany_remaining_candidates.json").write_bytes(new_candidates_path.read_bytes())
                      status["germany_remaining_alias_candidates"]=len(new_candidates["candidates"])
                  expanded_path=Path("ex_run/germany_expanded_shadow.json")
                  if expanded_path.is_file():
                      expanded=json.loads(expanded_path.read_text(encoding="utf-8"))
                      if expanded.get("ex_final_allowed") is not False or expanded.get("independently_verified_added") != 0:
                          raise ValueError("Unsafe expanded shadow evidence")
                      Path("reports/latest_germany_expanded_shadow.json").write_bytes(expanded_path.read_bytes())
                      status["germany_expanded_shadow_unmatched"]=expanded["expanded_shadow_unmatched"]
                  shadow_path=Path("ex_run/germany_shadow_comparison.json")
                  if shadow_path.is_file():
                      shadow=json.loads(shadow_path.read_text(encoding="utf-8"))
                      if shadow.get("ex_final_allowed") is not False or shadow.get("aliases_approved") is not False:
                          raise ValueError("Unsafe shadow evidence")
                      Path("reports/latest_germany_shadow_comparison.json").write_bytes(shadow_path.read_bytes())
                      status["germany_shadow_unmatched"]=shadow.get("shadow_germany_unmatched")
                  candidate_path=Path("ex_run/germany_alias_candidates.json")
                  if candidate_path.is_file():
                      candidate_data=json.loads(candidate_path.read_text(encoding="utf-8"))
                      if candidate_data.get("ex_final_allowed") is not False:
                          raise ValueError("Unsafe alias candidate evidence")
                      Path("reports/latest_germany_alias_candidates.json").write_bytes(candidate_path.read_bytes())
                      status["germany_alias_candidates"]=len(candidate_data["candidates"])
                  offline_path=Path("ex_run/germany_offline_shadow.json")
                  shadow_path=Path("ex_run/germany_shadow_comparison.json")
                  if offline_path.is_file() and shadow_path.is_file():
                      from ex_germany_shadow_metrics import validate_shadow_metrics
                      comparison=validate_shadow_metrics(
                          {"germany_unmatched":status["germany_unmatched"]},
                          json.loads(shadow_path.read_text(encoding="utf-8")),
                          json.loads(offline_path.read_text(encoding="utf-8")))
                      Path("reports/latest_germany_shadow_validated_metrics.json").write_text(
                          json.dumps(comparison,ensure_ascii=False,indent=2)+chr(10),
                          encoding="utf-8")
                      status["germany_shadow_reduction"]=comparison["shadow_reduction"]
                      status["independently_verified_added"]=0
              except (ValueError, KeyError, OSError) as exc:
                  status["evidence_published"]=False
                  status["publication_error"]=str(exc)
          else:
              status["evidence_published"]=False
          Path("reports/latest_pipeline_status.json").write_text(
              json.dumps(status,ensure_ascii=False,indent=2)+chr(10),encoding="utf-8")
          print(json.dumps(status,ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest_pipeline_status.json
          for report in reports/latest_secondary_review_summary.json reports/latest_germany_unresolved_review.csv reports/latest_germany_alias_candidates.json reports/latest_germany_shadow_comparison.json reports/latest_germany_offline_shadow.json reports/latest_germany_shadow_validated_metrics.json reports/latest_germany_shadow_remaining.json reports/latest_germany_remaining_candidates.json reports/latest_germany_expanded_shadow.json; do
            if [ -f "$report" ]; then git add "$report"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Sync audited review evidence and pipeline diagnostic [skip ci]'
            git pull --rebase origin ex-v43-development
            git push origin HEAD:ex-v43-development
          fi
      - name: Fail if audited evidence could not be published
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/latest_pipeline_status.json")
          if not p.is_file():
              raise SystemExit("Missing pipeline diagnostic")
          s=json.loads(p.read_text(encoding="utf-8"))
          if s.get("ingest_step")!="success" or s.get("review_step")!="success" or s.get("evidence_published") is not True:
              raise SystemExit("Audit pipeline failed: "+json.dumps(s))
          if s.get("shadow_step")!="success" or s.get("offline_shadow_step")!="success":
              raise SystemExit("Shadow comparison step failed: "+json.dumps(s))
          if not s.get("shadow_comparison_exists") or s.get("germany_name_only_candidates") is None or s.get("germany_shadow_reduction") is None or s.get("germany_shadow_remaining_count") is None or s.get("germany_remaining_alias_candidates") is None or s.get("germany_expanded_shadow_unmatched") is None:
              raise SystemExit("Missing shadow comparison output: "+json.dumps(s))
          PY
      - name: Upload evidence even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ex-review-evidence-${{ github.run_id }}
          path: ex_run/
          if-no-files-found: warn
          retention-days: 30
